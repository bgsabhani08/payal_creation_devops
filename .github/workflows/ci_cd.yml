name: Implementing Continuous Integration

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build web app
        run: flutter build web

      - name: Build Docker image
        run: docker build -t payal-creation-web:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag \
            payal-creation-web:${{ github.sha }} \
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Docker image to Amazon ECR
        run: |
          docker push \
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Update EC2 image tag
        run: |
          aws ssm put-parameter \
            --name "/payal-creation/docker-image-tag" \
            --value "${{ github.sha }}" \
            --type "String" \
            --overwrite \
            --region "${{ vars.AWS_REGION }}"

      - name: Start EC2 instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "payal-creation-ASG" \
            --preferences MinHealthyPercentage=100,InstanceWarmup=120 \
            --region "${{ vars.AWS_REGION }}"