name: Implementing Continuous Integration

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
  
      - name: Install flutter
        uses: subosito/flutter-action@v2
        

      - name: Install dependencies
        run: flutter pub get
  
      - name: Run tests
        run: flutter test
  
      - name: Build web app
        run: flutter build web

      - name: Build Docker image
        run: docker build -t payal-creation-web:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Tag docker image
        run: docker tag payal-creation-web:${{ github.sha }} ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push docker image to Amazon ECR
        run: docker push ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition payal-creation-web-task \
            --query taskDefinition > task-definition.json

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: payal-creation-web-container
          image: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: payal-creation-web-task-service
          cluster: payal-creation-web-cluster
          wait-for-service-stability: true