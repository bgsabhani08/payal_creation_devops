name: Implementing Continuous Integration

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
  
      - name: Install flutter
        uses: subosito/flutter-action@v2
        

      - name: Install dependencies
        run: flutter pub get
  
      - name: Run tests
        run: flutter test
  
      - name: Build web app
        run: flutter build web

      - name: Build Docker image
        run: docker build -t payal-creation-web:ci .

      - name: Debug OIDC context
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Role ARN var: ${{ vars.AWS_ROLE_ARN }}"

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Debug role ARN
        run: echo "ARN=[${{ vars.AWS_ROLE_ARN }}]"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        
      - name: Tag docker image
        run: docker tag payal-creation-web:ci ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:ci

      - name: Push docker image to Amazon ECR
        run: docker push ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:ci